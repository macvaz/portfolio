x-app-volumes: &app-volumes
  - ../src:/app/src:ro
  - ../html:/app/html:ro
  - ../api.py:/app/api.py:ro
  - ../batch.py:/app/batch.py:ro
  - ../category.py:/app/category.py:ro
  - ../data:/app/data
  - /tmp:/tmp

# Example .env (project root):
#   FRED_API_KEY=your_key_here
#   MS_BEARER_TOKEN_PATH=/tmp/morningstar.token

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: portfolio
    command: api
    ports:
      - "8000:8000"
    volumes: *app-volumes
    env_file:
      - ../.env
    environment:
      MS_BEARER_TOKEN_PATH: ${MS_BEARER_TOKEN_PATH:-/tmp/morningstar.token}
      TZ: ${TZ:-Europe/Madrid}

  batch:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: batch
    volumes: *app-volumes
    env_file:
      - ../.env
    environment:
      MS_BEARER_TOKEN_PATH: ${MS_BEARER_TOKEN_PATH:-/tmp/morningstar.token}
      TZ: ${TZ:-Europe/Madrid}
    profiles:
      - batch
    restart: "no"
